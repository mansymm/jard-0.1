name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تثبيت الحزم وتجهيز مشروع أندرويد
        run: |
          npm install
          npm run prepare-web
          npx cap add android
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: بناء ملف APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع ملف APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Inventory-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
